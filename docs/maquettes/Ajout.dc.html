<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OranPromo — Ajouter un article</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A0A;text-decoration:none}a:hover{color:#555555}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0A0A0A; font-family: 'Jost', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 14px 12px; border-bottom: 1px solid #E6E6E6">
<span></span>
<h1 style="margin: 0; text-align: center; font-size: 12px; font-weight: 500; letter-spacing: 2.5px">NOUVEL ARTICLE</h1>
<a href="MesArticles.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<main style="flex-grow: 1; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; gap: 10px">
<div style="width: 96px; height: 120px; background: #F3F2EF; display: flex; align-items: center; justify-content: center; color: #8A8A8A; font-size: 10px">[Photo]</div>
<button aria-label="Ajouter une photo" style="width: 96px; height: 120px; border: 1px solid #0A0A0A; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 2px; color: #0A0A0A; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.2"><path d="M12 5v14M5 12h14"></path></svg>PHOTO</button>
</div>

<p style="margin: 0; padding: 12px 0; border-top: 1px solid #0A0A0A; border-bottom: 1px solid #0A0A0A; font-size: 12px; font-weight: 300; line-height: 1.5; text-align: center">Fiche pré-remplie par l'IA à partir de la photo.<br>Vérifiez-la, puis indiquez le prix et les tailles.</p>

<label style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; letter-spacing: 2px; color: #6F6F6F">TITRE · PROPOSÉ PAR L'IA</span>
<input type="text" value="Polo piqué bleu marine" style="height: 40px; border: none; border-bottom: 1px solid #0A0A0A; background: transparent; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300; color: #0A0A0A; padding: 0">
</label>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 10px; letter-spacing: 2px; color: #6F6F6F">CATÉGORIE</span>
<select style="height: 40px; border: none; border-bottom: 1px solid #0A0A0A; background: transparent; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 300; color: #0A0A0A; padding: 0"><option>Polo</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 10px; letter-spacing: 2px; color: #6F6F6F">GENRE</span>
<select style="height: 40px; border: none; border-bottom: 1px solid #0A0A0A; background: transparent; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 300; color: #0A0A0A; padding: 0"><option>Homme</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 10px; letter-spacing: 2px; color: #6F6F6F">COULEUR</span>
<select style="height: 40px; border: none; border-bottom: 1px solid #0A0A0A; background: transparent; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 300; color: #0A0A0A; padding: 0"><option>Marine</option></select></label>
</div>

<label style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; letter-spacing: 2px; color: #6F6F6F">DESCRIPTION</span>
<textarea rows="2" style="border: none; border-bottom: 1px solid #0A0A0A; background: transparent; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 300; line-height: 1.5; color: #0A0A0A; padding: 6px 0; resize: none">Polo en coton piqué, coupe droite, col à deux boutons.</textarea>
</label>

<label style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; letter-spacing: 2px; color: #0A0A0A; font-weight: 500">PRIX EN DA *</span>
<input type="text" inputmode="numeric" placeholder="Votre prix" style="height: 40px; border: none; border-bottom: 2px solid #0A0A0A; background: transparent; font-family: 'Jost', sans-serif; font-size: 15px; color: #0A0A0A; padding: 0">
</label>

<fieldset style="margin: 0; padding: 0; border: none">
<legend style="padding: 0; margin-bottom: 8px; font-size: 10px; letter-spacing: 2px; font-weight: 500">TAILLES DISPONIBLES *</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #E6E6E6; border-left: 1px solid #E6E6E6">
<button aria-pressed="false" style="height: 44px; border: none; border-right: 1px solid #E6E6E6; border-bottom: 1px solid #E6E6E6; background: #FFFFFF; font-family: 'Jost', sans-serif; font-size: 13px; color: #0A0A0A">S</button>
<button aria-pressed="true" style="height: 44px; border: none; border-right: 1px solid #E6E6E6; border-bottom: 1px solid #E6E6E6; background: #0A0A0A; font-family: 'Jost', sans-serif; font-size: 13px; color: #FFFFFF">M</button>
<button aria-pressed="true" style="height: 44px; border: none; border-right: 1px solid #E6E6E6; border-bottom: 1px solid #E6E6E6; background: #0A0A0A; font-family: 'Jost', sans-serif; font-size: 13px; color: #FFFFFF">L</button>
<button aria-pressed="false" style="height: 44px; border: none; border-right: 1px solid #E6E6E6; border-bottom: 1px solid #E6E6E6; background: #FFFFFF; font-family: 'Jost', sans-serif; font-size: 13px; color: #0A0A0A">XL</button>
</div>
</fieldset>

</main>

<footer style="padding: 14px 24px 24px 24px">
<a href="MesArticles.dc.html" style="height: 54px; background: #0A0A0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 2.5px">PUBLIER L'ARTICLE</a>
</footer>

</div>
</x-dc>

</body>
</html>
